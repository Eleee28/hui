name: Lockfile
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      # Match the npm major used to generate the committed lockfile.
      - run: npm install -g npm@11
      # Fails when package.json and package-lock.json are out of sync.
      - run: npm ci --ignore-scripts
      - name: Verify isolated visual-test runner
        run: node --test e2e/visual-verification.test.mjs
